version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chailyn
      POSTGRES_USER: chailyn
      POSTGRES_PASSWORD: chailyn_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./services/api/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build: ./services/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://chailyn:chailyn_dev@db:5432/chailyn
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PATTERN_ENGINE_URL: http://pattern-engine:3001
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
    depends_on:
      - db

  pattern-engine:
    build: ./services/pattern-engine
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development

volumes:
  pg_data:
